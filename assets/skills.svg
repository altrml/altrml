<svg xmlns="http://www.w3.org/2000/svg" width="880" height="318" viewBox="0 0 880 318" role="img" aria-label="altrml skills">
<defs><style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.lbl{font-size:9.5px;letter-spacing:2.4px;fill:#8a8a8a}
.term{font-size:12.5px;letter-spacing:.6px;fill:#c9d1d9}
.col{font-size:9px;letter-spacing:2.2px;fill:#6e7681}
.row{animation:rise .5s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:.25;transform:translateY(4px)}to{opacity:1;transform:none}}
.scan{animation:sweep 8s linear infinite}
@keyframes sweep{0%{transform:translateY(-60px)}100%{transform:translateY(320px)}}
</style>
<linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
<stop offset=".5" stop-color="#ffffff" stop-opacity=".035"/>
<stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient></defs>
<rect x="0.5" y="0.5" width="879" height="317" rx="10" fill="#0d1117" stroke="#262626"/>
<rect x="0" y="0" width="880" height="318" rx="10" fill="url(#scan)" class="scan" opacity=".9"/>
