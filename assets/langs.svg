<svg xmlns="http://www.w3.org/2000/svg" width="420" height="162" viewBox="0 0 420 162" role="img" aria-label="altrml languages"><defs><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.lbl{font-size:9.5px;letter-spacing:2.4px;fill:#8a8a8a}.val{font-size:26px;font-weight:700;letter-spacing:1px;fill:#ffffff}.sub{font-size:10.5px;letter-spacing:1.4px;fill:#8a8a8a}.cell{animation:rise .55s cubic-bezier(.2,.7,.3,1) both}@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.scan{animation:sweep 7s linear infinite}@keyframes sweep{0%{transform:translateY(-40px)}100%{transform:translateY(170px)}}</style><linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".045"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs><rect x="0.5" y="0.5" width="419" height="161" rx="8" fill="#0d1117" stroke="#262626"/><rect x="0" y="0" width="420" height="162" fill="url(#scan)" class="scan" opacity=".9"/><text class="mono lbl" x="22" y="30">STACK</text><text class="mono sub" x="398" y="30" text-anchor="end">BY BYTES</text><line x1="22" y1="42" x2="398" y2="42" stroke="#262626"/><g class="cell" style="animation-delay:0ms"><text class="mono sub" x="22" y="72" fill="#c9d1d9">Python</text><rect x="150" y="66" width="150" height="6" rx="3" fill="#1a1a1a"/><rect x="150" y="66" width="150.0" height="6" rx="3" fill="#ffffff" fill-opacity="0.9"/><text class="mono sub" x="398" y="72" text-anchor="end">100%</text></g></svg>