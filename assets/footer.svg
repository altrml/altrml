<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-label="altrml">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0.9"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .label { font-size: 12px; letter-spacing: 5px; fill: #8a8a8a; }
      .dot { animation: blink 1.4s steps(1) infinite; }
      @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0.15 } }
      .wave { animation: drift 16s linear infinite; }
      @keyframes drift { 0% { transform: translateX(0) } 100% { transform: translateX(-1200px) } }
      .wave2 { animation: drift2 24s linear infinite; }
      @keyframes drift2 { 0% { transform: translateX(-1200px) } 100% { transform: translateX(0) } }
    </style>
  </defs>

  <rect width="1200" height="110" fill="#0d1117"/>
  <rect x="0" y="0" width="1200" height="110" fill="url(#fade)"/>

  <g class="wave" opacity="0.45">
    <path d="M0 34 C150 14 300 54 450 34 C600 14 750 54 900 34 C1050 14 1200 54 1350 34 C1500 14 1650 54 1800 34 C1950 14 2100 54 2250 34 C2400 14 2550 54 2700 34" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3"/>
  </g>
  <g class="wave2" opacity="0.3">
    <path d="M0 20 C150 2 300 38 450 20 C600 2 750 38 900 20 C1050 2 1200 38 1350 20 C1500 2 1650 38 1800 20 C1950 2 2100 38 2250 20 C2400 2 2550 38 2700 20" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.22"/>
  </g>

  <text class="mono label" x="600" y="80" text-anchor="middle">ALTRML</text>
  <circle class="dot" cx="648" cy="76" r="2.5" fill="#ffffff"/>
</svg>
