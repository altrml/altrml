<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" role="img" aria-label="altrml metrics"><defs><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.lbl{font-size:9.5px;letter-spacing:2.4px;fill:#8a8a8a}.val{font-size:30px;font-weight:700;letter-spacing:1px;fill:#ffffff}.sub{font-size:10.5px;letter-spacing:1.4px;fill:#8a8a8a}.row{animation:rise .6s cubic-bezier(.2,.7,.3,1) both}@keyframes rise{from{opacity:.3;transform:translateY(6px)}to{opacity:1;transform:none}}.scan{animation:sweep 7s linear infinite}@keyframes sweep{0%{transform:translateY(-50px)}100%{transform:translateY(230px)}}</style><linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".04"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs><rect x="0.5" y="0.5" width="879" height="219" rx="10" fill="#0d1117" stroke="#262626"/><rect x="0" y="0" width="880" height="220" rx="10" fill="url(#scan)" class="scan" opacity=".9"/><text class="mono lbl" x="28" y="34">METRICS</text><text class="mono sub" x="852" y="34" text-anchor="end">@altrml</text><line x1="28" y1="48" x2="852" y2="48" stroke="#262626"/><line x1="214" y1="72" x2="214" y2="182" stroke="#262626"/><line x1="455" y1="66" x2="455" y2="196" stroke="#262626"/><g class="row" style="animation-delay:0ms"><text class="mono lbl" x="28" y="74">REPOS</text><text class="mono val" x="28" y="100">1</text></g><g class="row" style="animation-delay:70ms"><text class="mono lbl" x="240" y="74">STARS</text><text class="mono val" x="240" y="100">0</text></g><g class="row" style="animation-delay:140ms"><text class="mono lbl" x="28" y="146">COMMITS 1Y</text><text class="mono val" x="28" y="172">29</text></g><g class="row" style="animation-delay:210ms"><text class="mono lbl" x="240" y="146">FOLLOWERS</text><text class="mono val" x="240" y="172">0</text></g><text class="mono lbl" x="480" y="76">STACK</text><text class="mono sub" x="852" y="76" text-anchor="end">BY BYTES</text><g class="row" style="animation-delay:120ms"><text class="mono sub" x="480" y="106" fill="#c9d1d9">Python</text><rect x="650" y="97" width="150" height="6" rx="3" fill="#181818"/><rect x="650" y="97" width="0" height="6" rx="3" fill="#ffffff" fill-opacity=".9"><animate attributeName="width" from="0" to="150.0" dur="1.1s" begin="120ms" fill="freeze"/></rect><text class="mono sub" x="852" y="106" text-anchor="end">100%</text></g><text class="mono sub" x="28" y="206">0 pr / 0 issues</text><text class="mono sub" x="852" y="206" text-anchor="end">1 repo tracked</text></svg>