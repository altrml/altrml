<svg xmlns="http://www.w3.org/2000/svg" width="420" height="162" viewBox="0 0 420 162" role="img" aria-label="altrml stats"><defs><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.lbl{font-size:9.5px;letter-spacing:2.4px;fill:#8a8a8a}.val{font-size:26px;font-weight:700;letter-spacing:1px;fill:#ffffff}.sub{font-size:10.5px;letter-spacing:1.4px;fill:#8a8a8a}.cell{animation:rise .55s cubic-bezier(.2,.7,.3,1) both}@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.scan{animation:sweep 7s linear infinite}@keyframes sweep{0%{transform:translateY(-40px)}100%{transform:translateY(170px)}}</style><linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".045"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs><rect x="0.5" y="0.5" width="419" height="161" rx="8" fill="#0d1117" stroke="#262626"/><rect x="0" y="0" width="420" height="162" fill="url(#scan)" class="scan" opacity=".9"/><text class="mono lbl" x="22" y="30">STATS</text><text class="mono sub" x="398" y="30" text-anchor="end">@altrml</text><line x1="22" y1="42" x2="398" y2="42" stroke="#262626"/><line x1="210" y1="58" x2="210" y2="146" stroke="#262626"/><g class="cell" style="animation-delay:0ms"><text class="mono lbl" x="22" y="66">REPOS</text><text class="mono val" x="22" y="82">1</text></g><g class="cell" style="animation-delay:90ms"><text class="mono lbl" x="216" y="66">STARS</text><text class="mono val" x="216" y="82">0</text></g><g class="cell" style="animation-delay:180ms"><text class="mono lbl" x="22" y="120">COMMITS 1Y</text><text class="mono val" x="22" y="136">17</text></g><g class="cell" style="animation-delay:270ms"><text class="mono lbl" x="216" y="120">FOLLOWERS</text><text class="mono val" x="216" y="136">0</text></g><text class="mono sub" x="398" y="152" text-anchor="end">0 pr / 0 issue